name: Mobile quality

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/ui-native/**'
      - 'packages/tokens/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile-quality.yml'
  push:
    branches: [dev]
    paths:
      - 'apps/mobile/**'
      - 'packages/ui-native/**'
      - 'packages/tokens/**'
      - 'packages/shared/**'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.34.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality:mobile
      - run: pnpm --filter mobile exec expo export --platform web --output-dir /tmp/sureground-mobile-web
