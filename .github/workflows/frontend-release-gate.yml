name: Frontend release gate

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: frontend-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Stop early so a broken suite reports a failure instead of timing out as "cancelled".
      - run: pnpm test:e2e:agent-sync --max-failures=3

  design-e2e:
    # Its own job, so a failing agent-sync suite can no longer stop it from running.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:design

  marketing-a11y:
    # Accessibility (axe, WCAG 2.2 AA serious/critical), overflow and broken-image audit of the
    # server-rendered marketing pages at phone width and in dark mode. No backend: API calls are
    # expected to fail and are ignored (E2E_API_OFFLINE).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      E2E_API_OFFLINE: '1'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:9
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sureground/shared build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config=playwright.visual.config.ts --project=web-mobile --project=web-dark --grep @marketing
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: marketing-a11y-report
          path: playwright-visual-report
          retention-days: 7

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_API_URL: https://api.invalid.example
      NEXT_PUBLIC_APP_URL: https://app.invalid.example
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sureground/shared build
      - run: pnpm tokens:check
      - run: pnpm icons:check
      - run: pnpm --filter web type-check
      - run: pnpm --filter backoffice type-check
      - run: pnpm --filter mobile type-check
      - run: pnpm --filter mobile type-check:test
      - run: pnpm audit:ui-controls
      # Ratchet the existing web warning baseline: new warnings fail the gate.
      - run: pnpm --filter web lint --max-warnings=0
      - run: pnpm --filter backoffice lint --max-warnings=0
      - run: pnpm --filter mobile lint --max-warnings=0
      - run: pnpm --filter mobile test:ci
      # The shared and web unit tests (node --test) were never run anywhere.
      - run: pnpm --filter @sureground/shared test
      - run: pnpm --filter web test:unit
      - run: pnpm --filter web build
      - run: pnpm --filter backoffice build
      - run: pnpm --filter mobile exec expo export --platform web --output-dir /tmp/sureground-mobile-web
