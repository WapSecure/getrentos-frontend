name: security
on:
  pull_request:
  push:
    branches: [dev, main]
  schedule:
    - cron: '0 4 * * 1'
jobs:
  secrets:
    # Security gap CI-01: this repository is public, so a committed secret is
    # exposed immediately. Fail the build on one (free gitleaks CLI via Docker).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
  dependencies:
    # Report-only for now: on 2026-11-06 the production tree had 1 critical and
    # 47 high transitive advisories left after the Next.js upgrade (mostly
    # mobile build tooling). Make this blocking once Dependabot has cleared them.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities in production dependencies
        run: pnpm audit --prod --audit-level=high

  codeql:
    # Security gap CI-01 (SAST): CodeQL is free for public repositories.
    # build-mode none analyses the TypeScript source without building the apps.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
