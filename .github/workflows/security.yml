name: security
on:
  pull_request:
  push:
    branches: [dev, main]
  schedule:
    - cron: '0 4 * * 1'
jobs:
  secrets:
    # Security gap CI-01: this repository is public, so a committed secret is
    # exposed immediately. Fail the build on one (free gitleaks CLI via Docker).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
  dependencies:
    # Report-only for now: on 2026-11-06 the production tree had 1 critical and
    # 47 high transitive advisories left after the Next.js upgrade (mostly
    # mobile build tooling). Make this blocking once Dependabot has cleared them.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities in production dependencies
        run: pnpm audit --prod --audit-level=high

  codeql:
    # Security gap CI-01 (SAST): CodeQL is free for public repositories.
    # build-mode none analyses the TypeScript source without building the apps.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3
